# Builds the interface and runs the Node and Python browser runtime tests.
# Tests that need Docker skip unless PERPETUAL_DOCKER_TESTS=1, so neither job starts containers.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Playwright journey tests run a real headless Chromium from the pinned @playwright/test.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test

  browser-runtime:
    name: Browser runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.12"
          cache-dependency-glob: integrations/browser-use/uv.lock
      - run: uv run --project integrations/browser-use --frozen python -m playwright install --with-deps chromium
      # The owned Chromium keeps its sandbox. The runner image restricts the unprivileged
      # user namespaces that sandbox needs, so lift the restriction on this disposable runner.
      - name: Allow the Chromium sandbox
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - run: npm run test:browser
