[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tally"
version = "1.4.0"
description = "Invoice totals from CSV exports, with sales tax by region"
requires-python = ">=3.11"

[project.scripts]
tally = "tally.cli:main"

[tool.setuptools]
packages = ["tally"]
